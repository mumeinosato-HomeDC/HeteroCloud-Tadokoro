[package]
name = "tadokoro"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mumeinosato-HomeDC/HeteroCloud-Tadokoro"
rust-version = "1.96"
description = "HeteroCloud provider/v1 service that provisions Proxmox VE virtual machines"
default-run = "tadokoro-api"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["http2", "macros"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
ipnet = "2.12"
jsonwebtoken = { version = "11.0", features = ["rust_crypto"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "http2", "json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.49", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["catch-panic", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.20", features = ["serde", "v5", "v7"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
